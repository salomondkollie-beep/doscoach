<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0D1230">
<title>Salomond Runner</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/api/icon?s=512">
<link rel="manifest" href="/manifest.json">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0D1230;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y;background:linear-gradient(rgba(8,10,40,.3),rgba(8,10,40,.9))}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:480px}
h1{margin:0;font-size:24px;line-height:1;letter-spacing:.5px;background:linear-gradient(90deg,#FFD54A,#FF8A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{background:rgba(255,255,255,.14);padding:7px 14px;border-radius:99px;font-weight:700}
#pv{width:min(46vw,190px);height:auto;flex:none}
.card{width:100%;max-width:480px;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card b{font-size:18px;display:block}.card small{opacity:.8}
.btn{background:#2ED8A3;color:#06352A;font-weight:800;padding:11px 16px;border-radius:12px}
.btn:disabled{opacity:.45}
.btn.alt{background:rgba(255,255,255,.16);color:#fff}
#chars{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:480px;padding:4px 2px;flex:none;touch-action:pan-x}
.cc{flex:none;width:78px;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700}
.cc canvas{width:56px;height:74px}.cc.on{outline:3px solid #FFD54A;background:rgba(255,213,74,.2)}.cc.lk canvas{opacity:.5;filter:grayscale(.6)}.cc small{font-size:11px;color:#FFD54A}
.big{width:100%;max-width:480px;padding:18px;border-radius:18px;font-size:24px;font-weight:900;letter-spacing:1px;background:linear-gradient(#FFB02E,#FF6B1A);color:#fff;box-shadow:0 5px 0 #A8400A,0 10px 24px rgba(255,120,30,.45);flex:none}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #A8400A}
.panel{width:100%;max-width:480px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 12px}
.panel h3{margin:0 0 6px;font-size:14px;opacity:.85}
.ms{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;margin:7px 0}.ms b{color:#FFD54A}
.ms i{grid-column:1/3;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}.ms u{display:block;height:100%;background:#2ED8A3}
.row{display:flex;gap:8px;width:100%;max-width:480px;flex:none}.row .btn{flex:1}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hl b{font-size:34px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5);display:block;line-height:1}
.hl small{opacity:.85;font-size:12px}
.hc{font-weight:800;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#pb{pointer-events:auto;background:rgba(0,0,0,.35);border-radius:12px;width:44px;height:40px;font-size:18px}
#pus{position:fixed;left:14px;top:calc(76px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#pus div{background:rgba(0,0,0,.4);border-radius:10px;padding:4px 10px 6px;font-weight:800;min-width:74px}
#pus i{display:block;height:4px;border-radius:4px;background:#2ED8A3;margin-top:3px;width:100%}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#2ED8A3;color:#06352A;font-weight:800;padding:10px 16px;border-radius:12px;transition:transform .3s;z-index:20;pointer-events:none}
#toast.on{transform:translate(-50%,0)}
.center{justify-content:center}
.score{font-size:64px;font-weight:900;line-height:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
 <div class="hl"><b id="hs">0</b><small>score</small></div>
 <div class="hc">🪙 <span id="hcn">0</span></div>
 <button id="pb" aria-label="Pause">⏸</button>
 <div id="pus"><div id="pmag" hidden>🧲<i></i></div><div id="pdbl" hidden>×2<i></i></div><div id="pshd" hidden>🛡️<i></i></div></div>
</div>
<div id="toast"></div>
<div id="menu" class="ov">
 <div class="top"><h1>Salomond<br>Runner</h1><div class="pill">🪙 <span id="mc">0</span></div></div>
 <canvas id="pv" width="240" height="280"></canvas>
 <div class="card"><div><b id="cn"></b><small id="cp"></small></div><button class="btn" id="cb"></button></div>
 <div id="chars"></div>
 <button class="big" id="play">JOUER</button>
 <div class="panel"><h3>Missions</h3><div id="miss"></div></div>
 <div class="row"><button class="btn alt" id="snd"></button><button class="btn alt" id="inst" hidden>📲 Installer</button></div>
</div>
<div id="pause" class="ov center" hidden>
 <h1>Pause</h1>
 <button class="big" id="rs">REPRENDRE</button>
 <button class="btn alt" id="pm2">Menu</button>
</div>
<div id="over" class="ov center" hidden>
 <h1>Perdu !</h1>
 <div class="score" id="os">0</div>
 <div id="ob2"></div><div id="oc" class="pill"></div>
 <button class="btn" id="rv"></button>
 <button class="big" id="again">REJOUER</button>
 <button class="btn alt" id="om">Menu</button>
</div>
<script src="/chars.js"></script>
<script src="/game.js"></script>
</body>
  </html>
